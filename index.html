<!DOCTYPE html>
<html lang="de">
<head>
  <!-- ===== PWA ===== -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05010f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #05010f;
    color: #0ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    overscroll-behavior: none; /* kein Pull-to-Refresh */
    user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Board ist IMMER ein perfektes Quadrat, das in beide Richtungen passt.
     vmin = min(vw, vh) → funktioniert auf 16:9, 4:3, Hochformat etc. */
  #board {
    position: relative;
    width: min(96vmin, 96vw, 96vh);
    height: min(96vmin, 96vw, 96vh);
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 50%, #0a0220 0%, #05010f 100%);
    border: 2px solid #0ff;
    box-shadow:
      0 0 10px #0ff,
      0 0 30px #0ff inset,
      0 0 30px #0ff;
    border-radius: 6px;
    overflow: hidden;
  }
  /* HUD liegt als Overlay INNERHALB des Boards → klaut keinen Platz,
     das Board bleibt exakt quadratisch. */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: clamp(11px, 2.2vmin, 17px);
    letter-spacing: 2px;
    text-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
    z-index: 5;
    pointer-events: none;
  }
  #hud .score { color: #0ff; }
  #hud .high { color: #f0f; text-shadow: 0 0 8px #f0f, 0 0 16px #f0f; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ===== Spiel-beenden-Button ganz oben ===== */
  .end-btn {
    position: fixed;
    top: 6px;
    top: max(6px, env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(5, 1, 15, 0.85);
    border: 2px solid #f0f;
    color: #f0f;
    font-family: inherit;
    font-size: clamp(10px, 2.2vmin, 14px);
    font-weight: bold;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    text-shadow: 0 0 6px #f0f;
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
	transition: all 0.6s;
  }
  .end-btn:hover, .end-btn:active {
    background: #f0f;
    color: #05010f;
    box-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
    text-shadow: none;
	opacity: 1;
  }
  .end-btn.hidden { display: none; }
  /* =====  ===== */

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 1, 15, 0.92);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(36px, 12vmin, 90px);
    font-weight: bold;
    letter-spacing: 8px;
    color: #0ff;
    text-shadow:
      0 0 8px #0ff,
      0 0 20px #0ff,
      0 0 40px #f0f,
      0 0 80px #f0f;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: clamp(11px, 2.8vmin, 15px);
    color: #f0f;
    text-shadow: 0 0 6px #f0f;
    letter-spacing: 3px;
    margin-bottom: 30px;
    opacity: 0.8;
  }
  .btn {
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-family: inherit;
    font-size: clamp(14px, 3.5vmin, 20px);
    letter-spacing: 3px;
    padding: 12px 32px;
    border-radius: 6px;
    cursor: pointer;
    text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 12px #0ff, 0 0 25px #0ff inset;
    transition: all 0.15s;
  }
  .btn:hover, .btn:active {
    background: #0ff;
    color: #05010f;
    box-shadow: 0 0 20px #0ff, 0 0 50px #0ff;
    text-shadow: none;
  }
  .finalScore {
    font-size: clamp(16px, 4vmin, 24px);
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .newHigh {
    font-size: clamp(13px, 3vmin, 18px);
    color: #f0f;
    text-shadow: 0 0 12px #f0f;
    margin-bottom: 24px;
    letter-spacing: 2px;
    animation: pulse 0.8s infinite alternate;
  }
  .newHigh.hidden { display: none; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
  
  
  @media (min-width: 900px) { 
	.end-btn { opacity: 0.3; }
  }
</style>
</head>
<body>

<!-- NEU: Spiel-beenden-Button ganz oben -->
<button id="endBtn" type="button" class="end-btn hidden">✕ BEENDEN</button>

<div id="game">
  <div id="board">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="score">PUNKTE: <span id="score">0</span></div>
      <div class="high">HIGH: <span id="highscore">0</span></div>
    </div>

    <div id="startScreen" class="overlay">
      <div class="title">SNAKE</div>
      <div class="subtitle">DARK NEON EDITION</div>
      <button class="btn" id="startBtn">LOS GEHT'S</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="title" style="font-size:clamp(24px,8vmin,50px);">GAME OVER</div>
      <div class="finalScore">PUNKTE: <span id="finalScore">0</span></div>
      <div class="newHigh hidden" id="newHigh">★ NEUER HIGHSCORE ★</div>
      <button class="btn" id="restartBtn">NOCHMAL</button>
    </div>
  </div>
</div>

<script>
(() => {
  const GRID = 20;
  const SPEED_START = 200; //org. 180
  const SPEED_MIN = 100; //org. 70
  const SPEED_STEP = 1; //org. 4

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('highscore');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newHighEl = document.getElementById('newHigh');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const endBtn = document.getElementById('endBtn'); // NEU

  let cellSize = 0;
  let dpr = window.devicePixelRatio || 1;

  let snake, dir, nextDir, food, animal, score, speed, running, tickTimer, lastTick;
  let highscore = parseInt(localStorage.getItem('snakeHighscore') || '0', 10);
  highEl.textContent = highscore;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    // Sicherheitsnetz: Canvas immer quadratisch halten
    const size = Math.min(rect.width, rect.height);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellSize = size / GRID;
    if (snake) draw();
  }
  window.addEventListener('resize', resizeCanvas);


  let audioCtx;
  function playEatSound() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);        // A5
    osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08); // E6
    gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  }

  function resetGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = SPEED_START;
    food = spawnFood();
    animal = null;
    scoreEl.textContent = '0';
    running = true;
    lastTick = 0;
  }

  function spawnFood() {
    const occupied = new Set();
    for (const s of snake) occupied.add(s.x + ',' + s.y);
    if (food) occupied.add(food.x + ',' + food.y);
    if (animal) occupied.add(animal.x + ',' + animal.y);
    let pos;
    let tries = 0;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      tries++;
    } while (occupied.has(pos.x + ',' + pos.y) && tries < 500);
    return pos;
  }

  function spawnAnimal() {
    if (animal) return;
    if (Math.random() < 0.28) {
      animal = spawnFood();
      animal.expires = performance.now() + 8000;
    }
  }

  // Tastatur-Eingabe (Referenz ist nextDir, damit schnelle Mehrfach-Eingaben korrekt sind)
  function setDir(nx, ny) {
    if (nx === -nextDir.x && ny === -nextDir.y) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener('keydown', (e) => {
    if (!running) return;
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
    }
  });

  // Touch-Steuerung im Nokia-Layout (3x3 Zonen).
  // Ecken: primäre Richtung bevorzugt. Bringt diese keine Änderung
  // (z.B. Fahrt schon nach oben bei Tipp auf oben-links), wird die
  // sekundäre Richtung genommen. So reagiert jede Ecke zuverlässig.
  function handleTouch(x, y) {
    const rect = canvas.getBoundingClientRect();
    const rx = (x - rect.left) / rect.width;
    const ry = (y - rect.top) / rect.height;
    if (rx < 0 || rx > 1 || ry < 0 || ry > 1) return;

    const col = Math.min(2, Math.floor(rx * 3));
    const row = Math.min(2, Math.floor(ry * 3));

    const ref = nextDir;

    function trySet(nx, ny) {
      if (nx === -ref.x && ny === -ref.y) return false; // 180°-Wendung
      if (nx === ref.x && ny === ref.y) return false;   // keine Änderung
      nextDir = { x: nx, y: ny };
      return true;
    }

    if (row === 0 && col === 0) {          // oben-links
      if (!trySet(0, -1)) trySet(-1, 0);
    } else if (row === 0 && col === 2) {   // oben-rechts
      if (!trySet(0, -1)) trySet(1, 0);
    } else if (row === 2 && col === 0) {   // unten-links
      if (!trySet(0, 1)) trySet(-1, 0);
    } else if (row === 2 && col === 2) {   // unten-rechts
      if (!trySet(0, 1)) trySet(1, 0);
    } else if (row === 0 && col === 1) {   // oben
      trySet(0, -1);
    } else if (row === 2 && col === 1) {   // unten
      trySet(0, 1);
    } else if (row === 1 && col === 0) {   // links
      trySet(-1, 0);
    } else if (row === 1 && col === 2) {   // rechts
      trySet(1, 0);
    }
    // Mitte (1,1): keine Aktion
  }

  // ---- Gesten-Steuerung: Wischen (ganzer Screen) + Tippen (Zonen) ----
  const SWIPE_MIN = 24;   // px Mindestdistanz, ab der ein Wisch erkannt wird
  let touchStart = null;  // { id, x, y, swiped }
  let lastTouchEnd = 0;

  function findTouch(list, id) {
    for (let i = 0; i < list.length; i++) {
      if (list[i].identifier === id) return list[i];
    }
    return null;
  }

  function doSwipe(dx, dy) {
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);   // rechts / links
    } else {
      setDir(0, dy > 0 ? 1 : -1);   // unten / oben
    }
  }

  // Start: nur merken – bewusst KEIN preventDefault,
  // damit die Buttons auf den Overlays klickbar bleiben.
  // NEU: Touches auf Buttons (z. B. „Beenden") werden ignoriert,
  //      damit der Klick nicht durch den touchend-Handler geschluckt wird.
  window.addEventListener('touchstart', (e) => {
    if (!running || e.touches.length > 1) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    const t = e.changedTouches[0];
    touchStart = { id: t.identifier, x: t.clientX, y: t.clientY, swiped: false };
  }, { passive: true });

  // Bewegung: Wisch erkennen + Scrollen/Pull-to-Refresh unterbinden
  window.addEventListener('touchmove', (e) => {
    e.preventDefault(); // verhindert Seiten-Refresh / Gummiband-Scrollen
    if (!running || !touchStart) return;
    const t = findTouch(e.changedTouches, touchStart.id);
    if (!t) return;
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.hypot(dx, dy) >= SWIPE_MIN) {
      touchStart.swiped = true;
      doSwipe(dx, dy);
      // Ankerpunkt nachziehen → weitere Wischer im selben Zug möglich
      touchStart.x = t.clientX;
      touchStart.y = t.clientY;
    }
  }, { passive: false });

  // Ende: kurzes Tippen ohne Bewegung → Nokia-Zonen-Steuerung
  window.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = findTouch(e.changedTouches, touchStart.id);
    if (!t) return;
    if (running) {
      e.preventDefault(); // unterdrückt synthetische Maus-Events (Doppel-Steuerung)
      lastTouchEnd = performance.now();
      if (!touchStart.swiped) handleTouch(t.clientX, t.clientY);
    }
    touchStart = null;
  }, { passive: false });

  window.addEventListener('touchcancel', () => { touchStart = null; });

  // Maus (Desktop): Tippen in Zonen, aber keine Geisterklicks nach Touch
  canvas.addEventListener('mousedown', (e) => {
    if (!running) return;
    if (performance.now() - lastTouchEnd < 500) return;
    handleTouch(e.clientX, e.clientY);
  });

  // NEU: Spiel-beenden-Button
  endBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (running) gameOver();
  });

  function step() {
    if (!running) return;

    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
      dir = nextDir;
    }

    const head = snake[0];
    const newHead = {
      x: (head.x + dir.x + GRID) % GRID,
      y: (head.y + dir.y + GRID) % GRID
    };

    const bodyToCheck = snake.slice(0, snake.length - 1);
    for (const s of bodyToCheck) {
      if (s.x === newHead.x && s.y === newHead.y) {
        return gameOver();
      }
    }

    snake.unshift(newHead);

    let ate = false;

    if (food && newHead.x === food.x && newHead.y === food.y) {
      score += 1;
      ate = true;
      scoreEl.textContent = score;
      food = spawnFood();
      speed = Math.max(SPEED_MIN, speed - SPEED_STEP );
      // console.log( "Speed", speed )
      spawnAnimal();
      playEatSound();
    }

    if (animal && newHead.x === animal.x && newHead.y === animal.y) {
      score += 10;
      ate = true;
      scoreEl.textContent = score;
      animal = null;
      playEatSound();
    }

    if (!ate) {
      snake.pop();
    }

    if (animal && performance.now() > animal.expires) {
      animal = null;
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(tickTimer);
    endBtn.classList.add('hidden'); // NEU: Beenden-Button ausblenden
    if (score > highscore) {
      highscore = score;
      localStorage.setItem('snakeHighscore', highscore);
      highEl.textContent = highscore;
      newHighEl.classList.remove('hidden');
    } else {
      newHighEl.classList.add('hidden');
    }
    finalScoreEl.textContent = score;
    gameOverScreen.classList.remove('hidden');
    draw();
  }

    function draw() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const cs = Math.min(w, h) / GRID;
    const offX = (w - cs * GRID) / 2;
    const offY = (h - cs * GRID) / 2;

    ctx.clearRect(0, 0, w, h);

    // Gitterlinien (dezent, passend zum Icon)
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(offX + i * cs, offY);
      ctx.lineTo(offX + i * cs, offY + cs * GRID);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(offX, offY + i * cs);
      ctx.lineTo(offX + cs * GRID, offY + i * cs);
      ctx.stroke();
    }

    // Tier (selten) – Magenta
    if (animal) {
      const cx = offX + (animal.x + 0.5) * cs;
      const cy = offY + (animal.y + 0.5) * cs;
      const t = performance.now() / 200;
      const r = cs * (0.32 + Math.sin(t) * 0.05);
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        const px = cx + Math.cos(ang) * rad;
        const py = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    // Apfel (Food) – im Stil des Icons
    if (food) {
      const cx = offX + (food.x + 0.5) * cs;
      const cy = offY + (food.y + 0.5) * cs;
      const r = cs * 0.32;
      
      ctx.fillStyle = '#1dee59'; // Helles Apfelgrün
      
      // Blatt / Stiel
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.1, cy - r * 0.8);
      ctx.quadraticCurveTo(cx + r * 1.2, cy - r * 1.5, cx + r * 1.3, cy - r * 0.9);
      ctx.quadraticCurveTo(cx + r * 0.7, cy - r * 0.5, cx + r * 0.1, cy - r * 0.8);
      ctx.fill();

      // Apfelkörper
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    // Schlange – im Stil des Icons (durchgehender Schlauch)
    const pad = cs * 0.1;
    const drawSnakePath = (color, width) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      
      for (let i = 0; i < snake.length; i++) {
        const pt = { x: offX + (snake[i].x + 0.5) * cs, y: offY + (snake[i].y + 0.5) * cs };
        
        if (i === 0) {
          ctx.moveTo(pt.x, pt.y);
        } else {
          const prev = snake[i - 1];
          // Check auf Wrap-Around (Teleportation über den Rand)
          if (Math.abs(snake[i].x - prev.x) > 1 || Math.abs(snake[i].y - prev.y) > 1) {
            ctx.moveTo(pt.x, pt.y); // Pfad unterbrechen
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
      }
      ctx.stroke();
    };

    // 1. Dunkler Rand der Schlange
    drawSnakePath('#0a9396', cs - pad * 2);
    // 2. Helle Innere Füllung
    drawSnakePath('#b2fefa', cs - pad * 2 - (cs * 0.15));

    // Kopf der Schlange
    const head = { x: offX + (snake[0].x + 0.5) * cs, y: offY + (snake[0].y + 0.5) * cs };
    const headRadius = (cs - pad * 2) / 2;

    // Kopf-Rand
    ctx.fillStyle = '#0a9396';
    ctx.beginPath();
    ctx.arc(head.x, head.y, headRadius, 0, Math.PI * 2);
    ctx.fill();

    // Kopf-Inneres
    ctx.fillStyle = '#b2fefa';
    ctx.beginPath();
    ctx.arc(head.x, head.y, headRadius * 0.75, 0, Math.PI * 2);
    ctx.fill();

    // Augen (Schwarze Punkte)
    ctx.fillStyle = '#000000';
    const eyeOffset = cs * 0.15;
    const eyeRadius = cs * 0.08;
    let e1x, e1y, e2x, e2y;

    if (dir.x === 1) { // Rechts
      e1x = head.x + eyeOffset; e1y = head.y - eyeOffset * 0.7;
      e2x = head.x + eyeOffset; e2y = head.y + eyeOffset * 0.7;
    } else if (dir.x === -1) { // Links
      e1x = head.x - eyeOffset; e1y = head.y - eyeOffset * 0.7;
      e2x = head.x - eyeOffset; e2y = head.y + eyeOffset * 0.7;
    } else if (dir.y === -1) { // Oben
      e1x = head.x - eyeOffset * 0.7; e1y = head.y - eyeOffset;
      e2x = head.x + eyeOffset * 0.7; e2y = head.y - eyeOffset;
    } else { // Unten
      e1x = head.x - eyeOffset * 0.7; e1y = head.y + eyeOffset;
      e2x = head.x + eyeOffset * 0.7; e2y = head.y + eyeOffset;
    }

    ctx.beginPath();
    ctx.arc(e1x, e1y, eyeRadius, 0, Math.PI * 2);
    ctx.arc(e2x, e2y, eyeRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop(now) {
    if (!running) return;
    if (now - lastTick >= speed) {
      lastTick = now;
      step();
    }
    requestAnimationFrame(loop);
  }

  function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    endBtn.classList.remove('hidden'); // NEU: Beenden-Button einblenden
    resizeCanvas();
    resetGame();
    draw();
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  // Initial
  resizeCanvas();
  resetGame();
  running = false;
  draw();
})();
</script>

<script>
  // ===== Service Worker registrieren (nur https / localhost) =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js', { scope: './' })
        .then((reg) => {
          // Update-Prüfung im Hintergrund
          reg.update().catch(() => {});

          // Wenn eine neue Version wartet → sofort übernehmen
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (
                newWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        })
        .catch((err) => {
          console.warn('[SW] Registrierung fehlgeschlagen:', err);
        });

      // Seite neu laden, wenn ein neuer SW übernommen hat
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>
