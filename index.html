<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #05010f;
    color: #0ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #game {
    position: relative;
    width: min(96vw, 96vh);
    height: min(96vw, 96vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: clamp(12px, 2.5vw, 18px);
    letter-spacing: 2px;
    text-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
  }
  #hud .score { color: #0ff; }
  #hud .high { color: #f0f; text-shadow: 0 0 8px #f0f, 0 0 16px #f0f; }
  #board {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    background:
      radial-gradient(circle at 50% 50%, #0a0220 0%, #05010f 100%);
    border: 2px solid #0ff;
    box-shadow:
      0 0 10px #0ff,
      0 0 30px #0ff inset,
      0 0 30px #0ff;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 1, 15, 0.92);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(36px, 12vw, 90px);
    font-weight: bold;
    letter-spacing: 8px;
    color: #0ff;
    text-shadow:
      0 0 8px #0ff,
      0 0 20px #0ff,
      0 0 40px #f0f,
      0 0 80px #f0f;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: clamp(11px, 2.8vw, 15px);
    color: #f0f;
    text-shadow: 0 0 6px #f0f;
    letter-spacing: 3px;
    margin-bottom: 30px;
    opacity: 0.8;
  }
  .btn {
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-family: inherit;
    font-size: clamp(14px, 3.5vw, 20px);
    letter-spacing: 3px;
    padding: 12px 32px;
    border-radius: 6px;
    cursor: pointer;
    text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 12px #0ff, 0 0 25px #0ff inset;
    transition: all 0.15s;
  }
  .btn:hover, .btn:active {
    background: #0ff;
    color: #05010f;
    box-shadow: 0 0 20px #0ff, 0 0 50px #0ff;
    text-shadow: none;
  }
  .finalScore {
    font-size: clamp(16px, 4vw, 24px);
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .newHigh {
    font-size: clamp(13px, 3vw, 18px);
    color: #f0f;
    text-shadow: 0 0 12px #f0f;
    margin-bottom: 24px;
    letter-spacing: 2px;
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="score">PUNKTE: <span id="score">0</span></div>
    <div class="high">HIGH: <span id="highscore">0</span></div>
  </div>
  <div id="board">
    <canvas id="canvas"></canvas>

    <div id="startScreen" class="overlay">
      <div class="title">SNAKE</div>
      <div class="subtitle">DARK NEON EDITION</div>
      <button class="btn" id="startBtn">LOS GEHT'S</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="title" style="font-size:clamp(24px,8vw,50px);">GAME OVER</div>
      <div class="finalScore">PUNKTE: <span id="finalScore">0</span></div>
      <div class="newHigh hidden" id="newHigh">★ NEUER HIGHSCORE ★</div>
      <button class="btn" id="restartBtn">NOCHMAL</button>
    </div>
  </div>
</div>

<script>
(() => {
  const GRID = 20;
  const SPEED_START = 180;
  const SPEED_MIN = 70;
  const SPEED_STEP = 4;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('highscore');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newHighEl = document.getElementById('newHigh');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  let cellSize = 0;
  let dpr = window.devicePixelRatio || 1;

  let snake, dir, nextDir, food, animal, score, speed, running, tickTimer, lastTick;
  let highscore = parseInt(localStorage.getItem('snakeHighscore') || '0', 10);
  highEl.textContent = highscore;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellSize = rect.width / GRID;
    if (snake) draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function resetGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = SPEED_START;
    food = spawnFood();
    animal = null;
    scoreEl.textContent = '0';
    running = true;
    lastTick = 0;
  }

  function spawnFood() {
    const occupied = new Set();
    for (const s of snake) occupied.add(s.x + ',' + s.y);
    if (food) occupied.add(food.x + ',' + food.y);
    if (animal) occupied.add(animal.x + ',' + animal.y);
    let pos;
    let tries = 0;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      tries++;
    } while (occupied.has(pos.x + ',' + pos.y) && tries < 500);
    return pos;
  }

  function spawnAnimal() {
    if (animal) return;
    if (Math.random() < 0.28) {
      animal = spawnFood();
      animal.expires = performance.now() + 8000;
    }
  }

  // Tastatur-Eingabe
  function setDir(nx, ny) {
    if (nx === -nextDir.x && ny === -nextDir.y) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener('keydown', (e) => {
    if (!running) return;
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
    }
  });

  // Touch-Steuerung im Nokia-Layout (3x3 Zonen)
  // Ecken: primäre Richtung bevorzugt, aber wenn diese die aktuelle Richtung ist
  // (also keine Änderung brächte), wird die sekundäre Richtung genommen.
  function handleTouch(x, y) {
    const rect = canvas.getBoundingClientRect();
    const rx = (x - rect.left) / rect.width;
    const ry = (y - rect.top) / rect.height;
    if (rx < 0 || rx > 1 || ry < 0 || ry > 1) return;

    const col = Math.min(2, Math.floor(rx * 3));
    const row = Math.min(2, Math.floor(ry * 3));

    const ref = nextDir;

    // Probiert eine Richtung zu setzen. Gibt true zurück, wenn sie
    // gültig ist UND eine tatsächliche Änderung bringt.
    function trySet(nx, ny) {
      if (nx === -ref.x && ny === -ref.y) return false; // 180°-Wendung
      if (nx === ref.x && ny === ref.y) return false;   // keine Änderung
      nextDir = { x: nx, y: ny };
      return true;
    }

    if (row === 0 && col === 0) {          // oben-links
      if (!trySet(0, -1)) trySet(-1, 0);
    } else if (row === 0 && col === 2) {   // oben-rechts
      if (!trySet(0, -1)) trySet(1, 0);
    } else if (row === 2 && col === 0) {   // unten-links
      if (!trySet(0, 1)) trySet(-1, 0);
    } else if (row === 2 && col === 2) {   // unten-rechts
      if (!trySet(0, 1)) trySet(1, 0);
    } else if (row === 0 && col === 1) {   // oben
      trySet(0, -1);
    } else if (row === 2 && col === 1) {   // unten
      trySet(0, 1);
    } else if (row === 1 && col === 0) {   // links
      trySet(-1, 0);
    } else if (row === 1 && col === 2) {   // rechts
      trySet(1, 0);
    }
    // Mitte (1,1): keine Aktion
  }

  canvas.addEventListener('touchstart', (e) => {
    if (!running) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    handleTouch(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (!running) return;
    handleTouch(e.clientX, e.clientY);
  });

  function step() {
    if (!running) return;

    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
      dir = nextDir;
    }

    const head = snake[0];
    const newHead = {
      x: (head.x + dir.x + GRID) % GRID,
      y: (head.y + dir.y + GRID) % GRID
    };

    const bodyToCheck = snake.slice(0, snake.length - 1);
    for (const s of bodyToCheck) {
      if (s.x === newHead.x && s.y === newHead.y) {
        return gameOver();
      }
    }

    snake.unshift(newHead);

    let ate = false;

    if (food && newHead.x === food.x && newHead.y === food.y) {
      score += 1;
      ate = true;
      scoreEl.textContent = score;
      food = spawnFood();
      speed = Math.max(SPEED_MIN, speed - SPEED_STEP);
      spawnAnimal();
    }

    if (animal && newHead.x === animal.x && newHead.y === animal.y) {
      score += 10;
      ate = true;
      scoreEl.textContent = score;
      animal = null;
    }

    if (!ate) {
      snake.pop();
    }

    if (animal && performance.now() > animal.expires) {
      animal = null;
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(tickTimer);
    if (score > highscore) {
      highscore = score;
      localStorage.setItem('snakeHighscore', highscore);
      highEl.textContent = highscore;
      newHighEl.classList.remove('hidden');
    } else {
      newHighEl.classList.add('hidden');
    }
    finalScoreEl.textContent = score;
    gameOverScreen.classList.remove('hidden');
    draw();
  }

  function draw() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const cs = w / GRID;

    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cs, 0);
      ctx.lineTo(i * cs, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cs);
      ctx.lineTo(w, i * cs);
      ctx.stroke();
    }

    if (animal) {
      const cx = (animal.x + 0.5) * cs;
      const cy = (animal.y + 0.5) * cs;
      const t = performance.now() / 200;
      const r = cs * (0.32 + Math.sin(t) * 0.05);
      ctx.save();
      ctx.shadowColor = '#f0f';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        const px = cx + Math.cos(ang) * rad;
        const py = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (food) {
      const cx = (food.x + 0.5) * cs;
      const cy = (food.y + 0.5) * cs;
      const r = cs * 0.3;
      ctx.save();
      ctx.shadowColor = '#0f0';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#3f9';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(cx - r*0.3, cy - r*0.3, r*0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const pad = cs * 0.1;
      const x = s.x * cs + pad;
      const y = s.y * cs + pad;
      const size = cs - pad * 2;

      const isHead = i === 0;
      const ratio = 1 - i / (snake.length + 3);

      ctx.save();
      if (isHead) {
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#7fffff';
      } else {
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(0, 255, 255, ${0.35 + ratio * 0.6})`;
      }
      const radius = isHead ? size * 0.28 : size * 0.2;
      roundRect(ctx, x, y, size, size, radius);
      ctx.fill();

      if (isHead) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#05010f';
        const eyeSize = size * 0.18;
        const ex = size * 0.3;
        const ey = size * 0.3;
        let e1x, e1y, e2x, e2y;
        if (dir.x === 1) { e1x = x + size - ex; e1y = y + ey; e2x = x + size - ex; e2y = y + size - ey - eyeSize; }
        else if (dir.x === -1) { e1x = x + ex - eyeSize; e1y = y + ey; e2x = x + ex - eyeSize; e2y = y + size - ey - eyeSize; }
        else if (dir.y === -1) { e1x = x + ey; e1y = y + ex - eyeSize; e2x = x + size - ey - eyeSize; e2y = y + ex - eyeSize; }
        else { e1x = x + ey; e1y = y + size - ex; e2x = x + size - ey - eyeSize; e2y = y + size - ex; }
        ctx.beginPath();
        ctx.arc(e1x + eyeSize/2, e1y + eyeSize/2, eyeSize/2, 0, Math.PI*2);
        ctx.arc(e2x + eyeSize/2, e2y + eyeSize/2, eyeSize/2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function loop(now) {
    if (!running) return;
    if (now - lastTick >= speed) {
      lastTick = now;
      step();
    }
    requestAnimationFrame(loop);
  }

  function startGame() {
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    resizeCanvas();
    resetGame();
    draw();
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  resizeCanvas();
  resetGame();
  running = false;
  draw();
})();
</script>
</body>
</html>
